# This workflow will run the unit tests on every push and pull request

name: Run Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Run unit tests
      run: python -m unittest discover -s tests/unit -t . -v
